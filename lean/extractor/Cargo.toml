[package]
name = "codeql-extractor-lean"
version = "0.1.0"
authors = ["GitHub"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
tree-sitter = ">= 0.23.0"
tree-sitter-javascript = { git = "https://github.com/tree-sitter/tree-sitter-javascript.git", rev = "3a837b6f3658ca3618f2022f8707e29739c91364"}
clap = { version = "4.2", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
rayon = "1.9.0"
regex = "1.10.4"
codeql-extractor = { path = "../../shared/tree-sitter-extractor" }
