extensions:
  # =============================================================================
  # lower-case-first (npm: "lower-case-first") — Lower-case the first character
  # =============================================================================
  #
  # Part of the change-case family of packages by Blake Embrey. Converts the
  # first character of a string to lower case.
  #
  #   import { lowerCaseFirst } from "lower-case-first";
  #   lowerCaseFirst("TEST");  //=> "tEST"
  #
  # Exports:
  #   lowerCaseFirst(input) → string
  #
  # Security concerns:
  # - No sources or sinks. This is a pure string transformation.
  # - Taint propagates from the input string to the returned string.
  #
  # Existing QLL coverage (StringFormatters.qll):
  # - Models lowerCaseFirst as a string formatter with taint flow from
  #   Argument[0] to the call result.
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Summaries: taint propagation through lowerCaseFirst
  # ---------------------------------------------------------------------------
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # lowerCaseFirst(input) → string
      - ["lower-case-first", "Member[lowerCaseFirst]", "Argument[0]", "ReturnValue", "taint"]
