# =============================================================================
# fastify-formbody / @fastify/formbody — URL-encoded body parser for Fastify
# =============================================================================
#
# A Fastify plugin that registers a content-type parser for
# application/x-www-form-urlencoded request bodies. After registration
# the parsed form data is available on request.body:
#
#   const fastify = require('fastify')();
#   fastify.register(require('@fastify/formbody'));
#   // or: fastify.register(require('fastify-formbody'));
#
#   fastify.post('/', (req, reply) => {
#     req.body.foo;   // attacker-controlled form field
#     reply.send(req.body);
#   });
#
# The plugin has no API surface of its own beyond registration. It
# simply makes request.body available for URL-encoded POST bodies.
# An optional `parser` function can be supplied (e.g., qs.parse) to
# support nested object structures.
#
# Security concerns:
# - request.body is fully attacker-controlled after this plugin is
#   registered — both property names and values come from the client.
# - The request.body source is already modeled in the fastify model
#   (as a remote source on any fastify-derived object). This file
#   exists for completeness and does not add further models since
#   the plugin exposes no distinct API.
#
# Existing QLL coverage (Fastify.qll):
#   Referenced in RequestInputAccess.isUserControlledObject() to mark
#   request.body as having attacker-controlled property names when
#   fastify-formbody is registered.
#
# No additional models needed beyond documenting the package.
#
# fastify-formbody is a pure configuration plugin: it registers a
# content-type parser so that Fastify populates request.body for
# URL-encoded forms. It does not expose any functions, classes, or
# methods beyond the plugin registration call.
#
# The untrusted data (request.body) is already covered by the
# fastify.model.yml source model for Fuzzy.Member[body].
# =============================================================================
extensions: []
