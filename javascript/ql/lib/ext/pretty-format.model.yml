extensions:
  # =============================================================================
  # pretty-format (npm: "pretty-format") — Stringify any JavaScript value
  # =============================================================================
  #
  # pretty-format is a Jest utility that serializes JavaScript values into
  # human-readable strings, handling all built-in types, circular references,
  # and custom types via plugins.
  #
  #   const { format: prettyFormat } = require('pretty-format');
  #   prettyFormat({ foo: 'bar' });
  #   //=> 'Object {\n  "foo": "bar",\n}'
  #
  #   // Or default export (older versions / direct call):
  #   const prettyFormat = require('pretty-format');
  #   prettyFormat(value, options);
  #
  # Exports:
  #   default export: format(val, options?) → string  (v28 and older)
  #   named export:   format(val, options?) → string  (v29+)
  #   plugins:        { ReactElement, ReactTestComponent, ... }
  #
  # Security concerns:
  # - No sources or sinks. Pure value-to-string serialization.
  # - Taint propagates from the input value to the returned string.
  #
  # Existing QLL coverage (JsonStringifiers.qll):
  # - Models require("pretty-format")(value) as a JsonStringifyCall,
  #   recognizing Argument[0] as the stringified input.
  # =============================================================================

  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # Default export call (v28 and older): prettyFormat(value, options?)
      - ["pretty-format", "", "Argument[0]", "ReturnValue", "taint"]

      # Named export (v29+): format(value, options?)
      - ["pretty-format", "Member[format]", "Argument[0]", "ReturnValue", "taint"]
