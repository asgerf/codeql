extensions:
  # =============================================================================
  # date-fns/lightFormat (sub-path of npm: "date-fns") - Date lightFormat function
  # =============================================================================
  #
  # Exports the `lightFormat` function as a default import:
  #
  #   import lightFormat from 'date-fns/lightFormat';
  #   lightFormat(new Date(), "yyyy-MM-dd 'some text'");
  #   //=> "2024-01-15 some text"
  #
  # Like `format`, the format string supports single-quote escaping to embed
  # arbitrary literal text, so an attacker-controlled format string results
  # in attacker-controlled output.
  #
  # Standard (non-curried) calling convention: lightFormat(date, formatStr) → string
  #
  # No sources or sinks — only a taint summary through the format string.
  #
  # Existing QLL coverage (DateFunctions.qll):
  #   Models lightFormat taint steps via FormatStep.
  # =============================================================================

  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # lightFormat(date, formatStr) — taint from formatStr to return value
      - ["date-fns/lightFormat", "", "Argument[1]", "ReturnValue", "taint"]
