extensions:
  # =============================================================================
  # date-fns/esm/fp/lightFormat (sub-path of npm: "date-fns") - Curried lightFormat
  # =============================================================================
  #
  # Exports the curried `lightFormat` function as a default ESM import:
  #
  #   import lightFormat from 'date-fns/esm/fp/lightFormat';
  #   lightFormat("yyyy-MM-dd 'some text'")(new Date());
  #   //=> "2024-01-15 some text"
  #
  # Like `format`, the format string supports single-quote escaping to embed
  # arbitrary literal text, so an attacker-controlled format string results
  # in attacker-controlled output.
  #
  # Curried calling convention: lightFormat(formatStr)(date) → string
  # =============================================================================

  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # lightFormat(formatStr)(date) — taint from formatStr to return value
      - ["date-fns/esm/fp/lightFormat", "", "Argument[0]", "ReturnValue.ReturnValue", "taint"]
