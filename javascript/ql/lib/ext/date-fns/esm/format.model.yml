extensions:
  # =============================================================================
  # date-fns/esm/format (sub-path of npm: "date-fns") - ESM date format function
  # =============================================================================
  #
  # Exports the `format` function as a default ESM import:
  #
  #   import format from 'date-fns/esm/format';
  #   format(new Date(), "yyyy-MM-dd 'some text'");
  #
  # The format string supports single-quote escaping to embed arbitrary
  # literal text, so an attacker-controlled format string results in
  # attacker-controlled output.
  # =============================================================================

  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # format(date, formatStr) — taint from formatStr to return value
      - ["date-fns/esm/format", "", "Argument[1]", "ReturnValue", "taint"]
