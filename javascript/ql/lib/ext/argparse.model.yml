extensions:
  # =============================================================================
  # argparse (npm: "argparse") - Command-line argument parser
  # =============================================================================
  #
  # argparse is a port of Python's argparse module for Node.js. It provides
  # ArgumentParser for defining CLI options and parsing process.argv.
  #
  #   const { ArgumentParser } = require("argparse");
  #   const parser = new ArgumentParser({ description: "My tool" });
  #   parser.add_argument("--port", { type: "int" });
  #   const args = parser.parse_args();
  #   // args.port, etc.
  #
  # Key methods on ArgumentParser instances:
  #   - parse_args([args]) / parseArgs([args])
  #   - parse_known_args([args]) / parseKnownArgs([args])
  #
  # Security concerns:
  # - The return value of parse_args / parse_known_args contains parsed
  #   command-line arguments, which are untrusted user input.
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Sources: parsed command-line arguments are untrusted input
  # ---------------------------------------------------------------------------
  - addsTo:
      pack: codeql/javascript-all
      extensible: sourceModel
    data:
      # new ArgumentParser(spec).parse_args() → { flag: value, ... }
      - ["argparse", "Member[ArgumentParser].Instance.Member[parse_args].ReturnValue", "commandargs"]
      # camelCase alias: new ArgumentParser(spec).parseArgs()
      - ["argparse", "Member[ArgumentParser].Instance.Member[parseArgs].ReturnValue", "commandargs"]
      # new ArgumentParser(spec).parse_known_args() → [namespace, remaining]
      - ["argparse", "Member[ArgumentParser].Instance.Member[parse_known_args].ReturnValue", "commandargs"]
      # camelCase alias: new ArgumentParser(spec).parseKnownArgs()
      - ["argparse", "Member[ArgumentParser].Instance.Member[parseKnownArgs].ReturnValue", "commandargs"]
