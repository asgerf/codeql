extensions:
  # =============================================================================
  # secure-random (npm: "secure-random") — Cryptographic random byte generation
  # =============================================================================
  #
  # Cross-platform wrapper for generating cryptographically secure random
  # bytes (Node.js crypto.randomBytes / browser crypto.getRandomValues):
  #
  #   const secureRandom = require('secure-random');
  #   secureRandom(16);                          // array of 16 random bytes
  #   secureRandom(16, { type: 'Buffer' });      // Node.js Buffer
  #   secureRandom(16, { type: 'Uint8Array' });  // Uint8Array
  #   secureRandom.randomArray(16);              // array
  #   secureRandom.randomUint8Array(16);         // Uint8Array
  #   secureRandom.randomBuffer(16);             // Buffer
  #
  # Security concerns:
  # - No sources. The library generates random data; it does not access
  #   external or untrusted input.
  # - No sinks. The library does not perform security-sensitive operations
  #   (no command execution, file I/O, URL navigation, or HTML rendering).
  # - No taint summaries. The output is freshly generated random bytes,
  #   not derived from the input (which is just a count).
  #
  # Existing QLL coverage (InsecureRandomnessCustomizations.qll):
  # - secureRandom(...) and secureRandom.randomArray/randomUint8Array/
  #   randomBuffer(...) are recognized as cryptographically secure random
  #   sources. This is used internally by the insecure-randomness query to
  #   suppress false positives in functions that use secure random APIs.
  #   This internal query logic cannot be expressed as data extensions.
  # =============================================================================
