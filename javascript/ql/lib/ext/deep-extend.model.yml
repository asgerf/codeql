extensions:
  # =============================================================================
  # deep-extend (npm: "deep-extend") - Recursive object extending
  # =============================================================================
  #
  # Recursively merges properties from source objects into a target object:
  #
  #   const deepExtend = require('deep-extend');
  #   deepExtend(target, src1, src2, ...)   // recursive merge into target
  #
  # Security concerns:
  # - deepExtend() is a deep-merge operation and is vulnerable to prototype
  #   pollution in versions before 0.5.1. If an attacker controls a source
  #   operand, they can inject __proto__ properties. (The prototype-pollution
  #   query is handled by QLL, not expressible via data extensions.)
  # - Taint from source operands flows into the destination and return value.
  #
  # Existing QLL coverage:
  #   Extend.qll:  deep-extend modeled as ExtendCallDeep (value-preserving
  #                flow from operands to destination and return value).
  #   PrototypePollutionCustomizations.qll: deep-extend flagged as vulnerable
  #                to prototype pollution in versions before 0.5.1.
  # =============================================================================
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # deepExtend(target, src1, src2, ...) — source operands flow into the destination
      - ["deep-extend", "", "Argument[1..N-1]", "Argument[0]", "value"]

      # deepExtend(target, src1, src2, ...) — all operands flow into the return value
      - ["deep-extend", "", "Argument[0..N-1]", "ReturnValue", "value"]
