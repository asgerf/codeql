extensions:
  # =============================================================================
  # title-case (npm: "title-case") - Convert a string to Title Case
  # =============================================================================
  #
  # Part of the change-case family of packages by Blake Embrey. Converts strings
  # to Title Case format (each word capitalized).
  #
  #   import { titleCase } from "title-case";
  #   titleCase("test string");  //=> "Test String"
  #   titleCase("fooBar");       //=> "Foo Bar"
  #
  # Exports:
  #   titleCase(input, options?) → string
  #
  # Security concerns:
  # - No sources or sinks. The function is a pure string transformation.
  # - Taint propagates from the input string to the returned string.
  #
  # Existing QLL coverage (StringFormatters.qll):
  #   CaseChangingStep recognizes titleCase from "title-case" and adds a
  #   string manipulation taint step from Argument[0] to ReturnValue.
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Summaries: taint propagation through title-case function
  # ---------------------------------------------------------------------------
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # titleCase(input, options?) → string
      - ["title-case", "Member[titleCase]", "Argument[0]", "ReturnValue", "taint"]
