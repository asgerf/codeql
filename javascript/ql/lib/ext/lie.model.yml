extensions:
  # =============================================================================
  # lie (npm: "lie") - Small Promises/A+ implementation
  # =============================================================================
  #
  # By Calvin Metcalf. A small, performant Promises/A+ polyfill providing the
  # standard Promise API.
  #
  #   const Promise = require('lie');
  #   new Promise(function(resolve, reject) { ... });
  #   Promise.resolve(value);
  #   Promise.reject(reason);
  #   Promise.all([p1, p2]);
  #   Promise.race([p1, p2]);
  #   promise.then(onFulfilled, onRejected);
  #   promise.catch(onRejected);
  #
  # Security concerns:
  # - No sources. The library does not access any external or untrusted data.
  # - No sinks. The library does not perform any security-sensitive operations.
  # - The Promise methods (.then, .catch, .all, .resolve, etc.) propagate data,
  #   but these are already modeled generically in CodeQL's Promises.qll, which
  #   recognizes require('lie') as a promise constructor reference.
  #
  # Existing QLL coverage:
  # - Promises.qll: Recognizes require('lie') as a promise constructor,
  #   enabling all built-in promise flow summaries.
  #
  # Nothing to model here. The library is a spec-compliant polyfill with no
  # security-relevant sources, sinks, or taint summaries beyond what CodeQL
  # already handles for promises generically.
  # =============================================================================
  []
