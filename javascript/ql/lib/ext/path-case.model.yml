extensions:
  # =============================================================================
  # path-case (npm: "path-case") - Convert a string to path/case
  # =============================================================================
  #
  # Part of the change-case family by Blake Embrey. Converts strings to
  # path/case format (words separated by forward slashes).
  #
  #   import { pathCase } from "path-case";
  #   pathCase("test string");  //=> "test/string"
  #   pathCase("fooBar");       //=> "foo/bar"
  #
  # Exports:
  #   pathCase(input, options?) → string
  #
  # Security concerns:
  # - No sources or sinks. Pure string transformation.
  # - Taint propagates from the input string to the returned string.
  #
  # Existing QLL coverage (StringFormatters.qll):
  #   pathCase modeled as CaseChanger — taint-preserving flow from
  #   argument 0 to return value.
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Summaries: taint propagation through pathCase
  # ---------------------------------------------------------------------------
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # pathCase(input, options?) → string
      - ["path-case", "Member[pathCase]", "Argument[0]", "ReturnValue", "taint"]
