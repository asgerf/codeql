extensions:
  # =============================================================================
  # cross-spawn-async (npm: "cross-spawn-async") - Cross-platform child_process.spawn
  # =============================================================================
  #
  # cross-spawn-async is a drop-in replacement for Node.js child_process.spawn
  # that handles cross-platform issues (shebangs, quoting, PATH on Windows).
  # It is the predecessor of the cross-spawn package; its API is identical but
  # it only exposes an async spawn function (no .sync method).
  #
  #   const spawn = require('cross-spawn-async');
  #
  #   // spawn(command, args?, options?)
  #   const child = spawn('npm', ['list', '-g'], { stdio: 'inherit' });
  #
  # - command (string): The command to run.
  # - args (array, optional): Arguments to the command.
  # - options (object, optional): Same options as child_process.spawn.
  #
  # Security concerns:
  # - SINK: The command argument (arg 0) is executed as an OS command →
  #   command-injection risk.
  # - SINK: The args array (arg 1) contains command-line arguments that are
  #   passed directly to the spawned process → command-injection risk.
  # - No shell interpretation by default (unlike child_process.exec), but
  #   still executes arbitrary commands.
  # - No sources. The library does not provide HTTP or untrusted data access.
  #
  # Existing QLL coverage:
  # - SystemCommandExecutors.qll: Models spawn(cmd, args) as
  #   SystemCommandExecution with cmdArg=0, shell=false.
  # =============================================================================

  # Sinks: Command and arguments are command-injection vectors.
  - addsTo:
      pack: codeql/javascript-all
      extensible: sinkModel
    data:
      # spawn(command, args?, options?) — command is arg 0
      - ["cross-spawn-async", "Argument[0]", "command-injection"]

      # spawn(command, args, options?) — args array elements
      - ["cross-spawn-async", "Argument[1]", "command-injection"]
