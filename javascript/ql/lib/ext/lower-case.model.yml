extensions:
  # =============================================================================
  # lower-case (npm: "lower-case") - Convert a string to lower case
  # =============================================================================
  #
  # Part of the change-case family of packages by Blake Embrey. Converts strings
  # to lower case format.
  #
  #   import { lowerCase, localeLowerCase } from "lower-case";
  #   lowerCase("TEST");               //=> "test"
  #   localeLowerCase("TEST", "en");   //=> "test"
  #
  # Exports:
  #   lowerCase(input) → string
  #   localeLowerCase(input, locales?) → string
  #
  # Security concerns:
  # - No sources or sinks. All functions are pure string transformations.
  # - Taint propagates from the input string to the returned string.
  #
  # Existing QLL coverage:
  # - StringFormatters.qll: Models lowerCase and localeLowerCase as
  #   CaseChangingStep (taint from Argument[0] to return value).
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Summaries: taint propagation through lower-case functions
  # ---------------------------------------------------------------------------
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # lowerCase(input) → string
      - ["lower-case", "Member[lowerCase]", "Argument[0]", "ReturnValue", "taint"]
      # localeLowerCase(input, locales?) → string
      - ["lower-case", "Member[localeLowerCase]", "Argument[0]", "ReturnValue", "taint"]
