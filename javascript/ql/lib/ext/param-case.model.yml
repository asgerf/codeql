extensions:
  # =============================================================================
  # param-case (npm: "param-case") — Convert a string to param-case (kebab-case)
  # =============================================================================
  #
  # Part of the change-case family of packages by Blake Embrey. Converts strings
  # to param-case (kebab-case) format:
  #
  #   import { paramCase } from "param-case";
  #   paramCase("test string");  //=> "test-string"
  #   paramCase("fooBar");       //=> "foo-bar"
  #
  # Exports:
  #   paramCase(input, options?) → string
  #
  # Security concerns:
  # - No sources or sinks. Pure string transformation.
  # - Taint propagates from the input string to the returned string.
  #
  # Existing QLL coverage (StringFormatters.qll):
  # - CaseChangingStep models paramCase as a taint step from argument to
  #   return value.
  # =============================================================================

  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # paramCase(input, options?) → string
      - ["param-case", "Member[paramCase]", "Argument[0]", "ReturnValue", "taint"]
