extensions:
  # =============================================================================
  # abab (npm: "abab") - Base64 encoding/decoding (atob/btoa polyfill)
  # =============================================================================
  #
  # The abab package exports { atob, btoa } as a polyfill for the browser-native
  # base64 functions.
  #
  #   const { atob, btoa } = require("abab");
  #   const encoded = btoa("hello");    // "aGVsbG8="
  #   const decoded = atob("aGVsbG8="); // "hello"
  #
  # This library has no sources or sinks. It only performs data transformation.
  # Only decoding (atob) is modeled as taint-propagating, consistent with the
  # existing CodeQL convention that base64 encoding is not a taint step (to
  # avoid false positives from encoded values being treated as attacker-controlled).
  # =============================================================================
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # abab.atob(encoded) - decode base64 string. Taint flows from input to output.
      - ["abab", "Member[atob]", "Argument[0]", "ReturnValue", "taint"]
