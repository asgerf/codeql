extensions:
  # =============================================================================
  # pascal-case (npm: "pascal-case") — Convert a string to PascalCase
  # =============================================================================
  #
  # Part of the change-case family of packages by Blake Embrey. Converts strings
  # to PascalCase format.
  #
  #   import { pascalCase } from "pascal-case";
  #   pascalCase("test string");  //=> "TestString"
  #   pascalCase("foo-bar");      //=> "FooBar"
  #
  # Exports:
  #   pascalCase(input, options?) → string
  #   pascalCaseTransform(input, index) → string
  #   pascalCaseTransformMerge(input, index) → string
  #
  # Security concerns:
  # - No sources or sinks. All functions are pure string transformations.
  # - Taint propagates from the input string to the returned string.
  #
  # Existing QLL coverage (StringFormatters.qll):
  #   CaseChangingStep models pascalCase as a stringManipulationStep
  #   (taint from Argument[0] to return value).
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Summaries: taint propagation through pascal-case functions
  # ---------------------------------------------------------------------------
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # pascalCase(input, options?) → string
      - ["pascal-case", "Member[pascalCase]", "Argument[0]", "ReturnValue", "taint"]
      # pascalCaseTransform(input, index) → string
      - ["pascal-case", "Member[pascalCaseTransform]", "Argument[0]", "ReturnValue", "taint"]
      # pascalCaseTransformMerge(input, index) → string
      - ["pascal-case", "Member[pascalCaseTransformMerge]", "Argument[0]", "ReturnValue", "taint"]
