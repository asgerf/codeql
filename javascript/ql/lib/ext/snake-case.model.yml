extensions:
  # =============================================================================
  # snake-case (npm: "snake-case") - Convert a string to snake_case
  # =============================================================================
  #
  # Part of the change-case family of packages by Blake Embrey. Converts strings
  # to snake_case format (deprecated in v4 — use `change-case` instead).
  #
  #   import { snakeCase } from "snake-case";
  #   snakeCase("test string");   //=> "test_string"
  #   snakeCase("fooBar");        //=> "foo_bar"
  #   snakeCase("FOO-BAR");       //=> "foo_bar"
  #
  # Exports:
  #   snakeCase(input, options?) → string
  #
  # Security concerns:
  # - No sources or sinks. The function is a pure string transformation.
  # - Taint propagates from the input string to the returned string.
  #
  # Existing QLL coverage (StringFormatters.qll):
  # - CaseChangingStep: recognizes snakeCase from "snake-case" and adds a
  #   string manipulation taint step from Argument[0] to ReturnValue.
  #
  # The data extension below duplicates the QLL coverage for robustness.
  # =============================================================================

  # ---------------------------------------------------------------------------
  # Summaries: taint propagation through snake-case functions
  # ---------------------------------------------------------------------------
  - addsTo:
      pack: codeql/javascript-all
      extensible: summaryModel
    data:
      # snakeCase(input, options?) → string
      - ["snake-case", "Member[snakeCase]", "Argument[0]", "ReturnValue", "taint"]
